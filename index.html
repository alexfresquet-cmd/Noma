<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ee" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Noma — Beta 1</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.20.1-beta.3" crossorigin="use-credentials" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
:root {
  --bg: #f5f3ee;
  --card: #fffdf8;
  --text: #171714;
  --muted: #747169;
  --line: #dcd8ce;
  --soft: #ebe7dc;
  --accent: #1f4d3b;
  --danger: #8b2e2e;
  --radius: 24px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { min-height: 100dvh; overflow-x: hidden; }
button, input { font: inherit; }
button { cursor: pointer; }

.app-shell {
  width: min(100%, 520px);
  min-height: 100dvh;
  margin: 0 auto;
  padding: 28px 20px calc(124px + env(safe-area-inset-bottom));
}

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; }
.brand { font-size: 24px; font-weight: 750; letter-spacing: -0.04em; }
.lang { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: rgba(255,255,255,.35); }

.hero { margin: 18px 0 34px; }
.eyebrow { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .08em; }
.big-number { font-size: clamp(56px, 18vw, 92px); line-height: .9; font-weight: 760; letter-spacing: -0.075em; }
.big-number span { font-size: 16px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.substat { margin-top: 14px; color: var(--muted); font-size: 15px; }
.progress-line { height: 6px; border-radius: 999px; background: var(--soft); margin-top: 22px; overflow: hidden; }
.progress-line > div { height: 100%; background: var(--text); border-radius: inherit; transition: width .3s ease; }

.card { background: var(--card); border: 1px solid rgba(0,0,0,.06); border-radius: var(--radius); padding: 22px; box-shadow: 0 12px 30px rgba(24,24,20,.05); }
.session-card { display: grid; gap: 18px; }
.session-title { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.session-title strong { font-size: 22px; letter-spacing: -.03em; }
.session-title span { color: var(--muted); font-size: 14px; }
.session-list { display: grid; gap: 10px; color: #403e39; font-size: 15px; }
.session-row { display: flex; justify-content: space-between; gap: 12px; }
.session-row em { font-style: normal; color: var(--muted); }

.primary, .secondary, .ghost, .danger-btn {
  border: 0; border-radius: 16px; min-height: 52px; padding: 14px 18px; font-weight: 700;
}
.primary { background: var(--text); color: #fff; width: 100%; }
.secondary { background: var(--soft); color: var(--text); width: 100%; }
.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.danger-btn { background: #f4e8e5; color: var(--danger); }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.button-stack { display: grid; gap: 10px; }

.exercise-wrap { display: block; }
.app-shell.exercise-shell { padding-top: 14px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
.exercise-head { display: flex; align-items: center; gap: 12px; margin-bottom: 0; }
.back { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 19px; }
.step-track { flex: 1; height: 4px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.step-track > div { height: 100%; background: var(--text); }
.step-count { color: var(--muted); font-size: 13px; min-width: 38px; text-align: right; }
.finish-session { border:0; background:transparent; color:var(--muted); font-size:13px; font-weight:700; padding:8px 0 8px 6px; white-space:nowrap; }
.finish-session:active { color:var(--text); }
.exercise-main { display: block; padding-top: 18px; padding-bottom: 28px; }
.exercise-content { width: 100%; }
.answer-zone { margin-top: 4px; }
.answer-display { width: 100%; min-height: 47px; border-bottom: 2px solid var(--line); padding: 10px 2px; font-size: 21px; color: var(--text); margin: 4px 0 10px; display:flex; align-items:center; }
.answer-display.muted { color: var(--muted); }
.status-chip { min-height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; padding:14px 12px; font-weight:700; border:1px solid var(--line); background:var(--card); }
.status-chip.ok { background:#e7efe9; border-color:#d7e6db; }
.status-chip.bad { background:#f4e8e5; border-color:#ead6d2; color:var(--danger); }
.result-detail { margin-top:18px; }
.result-detail .feedback { margin-top:0; }
.mode-picker { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--soft); border-radius:16px; padding:5px; }
.mode-btn { border:0; min-height:42px; border-radius:12px; background:transparent; color:var(--muted); font-weight:700; font-size:13px; }
.mode-btn.active { background:var(--card); color:var(--text); box-shadow:0 2px 8px rgba(24,24,20,.06); }
.mode-note { color:var(--muted); font-size:13px; line-height:1.4; margin-top:-4px; }

.exercise-type { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .09em; margin-bottom: 8px; }
.prompt-word { font-size: clamp(42px, 13vw, 68px); font-weight: 750; letter-spacing: -.055em; line-height: 1; margin: 2px 0 10px; }
.prompt-sentence { font-size: clamp(25px, 8vw, 30px); line-height: 1.15; font-weight: 680; letter-spacing: -.04em; margin: 4px 0 14px; }
.hint { color: var(--muted); font-size: 15px; line-height: 1.35; }
.reveal { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 20px; }
.reveal strong { display: block; font-size: 22px; margin-bottom: 8px; }
.example { font-size: 17px; line-height: 1.5; margin-top: 14px; }
.example small { display:block; color:var(--muted); font-size:14px; margin-top: 4px; }

.answer-input { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 10px 2px; font-size: 21px; outline: none; color: var(--text); margin: 4px 0 10px; }
.answer-input:focus { border-bottom-color: var(--text); }
.feedback { border-radius: 18px; padding: 16px; margin: 8px 0 18px; font-size: 15px; line-height: 1.45; }
.feedback.ok { background: #e7efe9; }
.feedback.bad { background: #f4e8e5; }
.feedback b { display: block; margin-bottom: 4px; }

.done { text-align: left; padding-top: 10vh; }
.done h1 { font-size: 58px; letter-spacing: -.06em; margin: 0 0 18px; }
.done p { color: var(--muted); line-height: 1.5; }
.delta { font-size: 34px; font-weight: 760; letter-spacing: -.045em; margin: 34px 0 8px; }

.section-title { font-size: 32px; letter-spacing: -.045em; margin: 10px 0 6px; }
.section-sub { color: var(--muted); margin: 0 0 26px; line-height: 1.45; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
.stat { background: var(--card); border: 1px solid rgba(0,0,0,.06); border-radius: 20px; padding: 18px; }
.stat b { display: block; font-size: 30px; letter-spacing: -.04em; }
.stat span { color: var(--muted); font-size: 13px; }
.list { display: grid; gap: 10px; margin: 18px 0 26px; }
.list-item { padding: 16px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.list-item span:last-child { color: var(--muted); }

.bottom-dock { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 520px); z-index: 1000; background: var(--bg); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,.045); }
.bottom-nav { width: 100%; display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; background: var(--card); border: 1px solid rgba(0,0,0,.07); border-radius: 22px; padding: 7px; box-shadow: 0 8px 28px rgba(0,0,0,.07); }
.nav-btn { border: 0; background: transparent; border-radius: 16px; min-height: 48px; color: var(--muted); font-size: 13px; font-weight: 650; }
.nav-btn.active { background: var(--text); color: white; }

.note { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 16px; }
.demo-tools { margin-top: 30px; padding-top: 20px; border-top: 1px dashed var(--line); }
.demo-tools summary { color: var(--muted); cursor: pointer; font-size: 13px; }
.demo-actions { display: grid; gap: 10px; margin-top: 12px; }

@media (max-width: 380px) {
  .app-shell { padding-left: 16px; padding-right: 16px; }
  .exercise-main { padding-top: 14px; }
  .prompt-sentence { font-size: 26px; }
  .button-row { grid-template-columns: 1fr; }
}

/* v0.2 — swipe answer for Word */
.swipe-stage { position: relative; min-height: 310px; display: grid; place-items: center; padding: 12px 0; overflow: visible; }
.swipe-card { position: relative; width: min(100%, 390px); min-height: 280px; padding: 34px 26px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--card); border: 1px solid rgba(0,0,0,.07); border-radius: 30px; box-shadow: 0 20px 45px rgba(24,24,20,.10); touch-action: pan-y; user-select: none; will-change: transform; }
.swipe-card .prompt-word { margin: 0 0 18px; }
.swipe-stamp { position: absolute; top: 24px; padding: 7px 11px; border: 2px solid currentColor; border-radius: 10px; font-size: 14px; font-weight: 850; letter-spacing: .12em; opacity: 0; transition: opacity .08s ease; }
.swipe-stamp.no { left: 22px; color: var(--danger); transform: rotate(-8deg); }
.swipe-stamp.yes { right: 22px; color: var(--accent); transform: rotate(8deg); }
.swipe-card.drag-left .swipe-stamp.no, .swipe-card.drag-right .swipe-stamp.yes { opacity: 1; }
.swipe-help { text-align: center; color: var(--muted); font-size: 13px; margin: 5px 0 18px; }
.swipe-actions { display: flex; justify-content: center; gap: 28px; }
.swipe-btn { width: 62px; height: 62px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 30px; font-weight: 500; box-shadow: 0 8px 20px rgba(24,24,20,.07); }
.no-btn { color: var(--danger); }
.yes-btn { color: var(--accent); }
.choice-correction { width: 100%; min-height: 46px; margin: 0 0 10px; border: 0; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

.forget-summary { width:100%; margin:14px 0 0; border:1px solid var(--line); background:var(--card); border-radius:18px; padding:15px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--text); text-align:left; }
.forget-summary em { color:var(--muted); font-style:normal; font-size:13px; }
.forget-list { display:grid; gap:10px; margin:18px 0 96px; }
.forget-item { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
.forget-item summary { list-style:none; padding:16px; display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer; }
.forget-item summary::-webkit-details-marker { display:none; }
.forget-item summary span { display:grid; gap:3px; }
.forget-item summary small { color:var(--muted); font-size:12px; font-weight:500; }
.forget-item summary em { color:var(--muted); font-size:12px; font-style:normal; white-space:nowrap; }
.forget-detail { border-top:1px solid var(--line); padding:15px 16px 17px; }
.forget-detail p { margin:8px 0 4px; }
.forget-detail small { color:var(--muted); }
.empty-state { padding:26px 20px; border:1px dashed var(--line); border-radius:18px; text-align:center; color:var(--muted); }
.empty-state b { color:var(--text); }
.data-card { margin-top:16px; }
@media (max-width:380px){ .nav-btn{font-size:11px;} }

/* v0.4: typed Word recall */
.word-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px;margin-top:8px}
.secondary{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:15px 18px;font:inherit;font-weight:700;cursor:pointer}
.your-answer{margin:18px 0 12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.your-answer span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.your-answer b{font-size:17px}

.cloze-card{margin:8px 0 14px;padding:18px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);font-size:22px;line-height:1.45;letter-spacing:-.02em}
.cloze-blank{display:inline-block;min-width:86px;border-bottom:2px solid var(--text);text-align:center;font-weight:700;letter-spacing:.06em}
.translation-note{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 14px}
.auto-grade-note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:10px}
@media (max-width:420px){.word-actions{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px}.primary,.secondary{padding-left:10px;padding-right:10px}}

/* v0.8: Listen Once — separate skill, same stable mobile geometry */
.listen-home-card{margin-top:12px;display:grid;gap:14px}
.listen-home-copy{color:var(--muted);font-size:14px;line-height:1.45;margin:0}
.listen-metric{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:2px}
.listen-metric b{font-size:28px;letter-spacing:-.04em}
.listen-metric span{color:var(--muted);font-size:13px}
.listen-stage{min-height:132px;display:grid;place-items:center;align-content:center;gap:9px;margin:2px 0 8px}
.listen-play{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--text);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 10px 28px rgba(24,24,20,.10)}
.listen-play:disabled{opacity:.58;cursor:default}
.listen-state{min-height:20px;color:var(--muted);font-size:13px;text-align:center}
.listen-error{color:var(--danger)}
.answer-input:disabled{opacity:.55;cursor:not-allowed}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.listen-badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);font-weight:700}


/* v0.10: Tiny Reader — static curated texts + six closed questions */
.reader-home-card{margin-top:12px;display:grid;gap:14px}
.reader-home-copy{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.reader-library{display:grid;gap:18px;margin:18px 0 26px}
.reader-group{display:grid;gap:12px}
.reader-group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 2px}
.reader-group-head h2{margin:0;font-size:18px;letter-spacing:-.025em}
.reader-group-head span{color:var(--muted);font-size:13px;white-space:nowrap}
.reader-group.pending{padding-bottom:20px;border-bottom:2px solid var(--text)}
.reader-group.completed{margin-top:2px;padding:16px;border-radius:24px;background:#ebe8df}
.reader-group.completed .reader-card{box-shadow:none;background:#f8f6f0;border-color:rgba(0,0,0,.07)}
.reader-group-empty{padding:18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:14px;line-height:1.45;background:rgba(255,255,255,.28)}
.reader-status-badge{display:inline-flex;align-items:center;width:max-content;max-width:100%;font-size:12px;font-weight:700;border-radius:999px;padding:6px 9px;background:var(--soft);color:var(--muted)}
.reader-status-badge.pending{background:var(--text);color:var(--card)}
.reader-status-badge.errors{background:#f4e8e5;color:var(--danger)}
.reader-status-badge.done{background:#e7efe9;color:#315d47}
.reader-card{background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:22px;padding:19px;display:grid;gap:12px;box-shadow:0 10px 26px rgba(24,24,20,.04)}
.reader-card h2{font-size:21px;letter-spacing:-.03em;margin:0}
.reader-card p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.reader-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px}
.reader-meta span{border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.35)}
.reader-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.reader-back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:19px;flex:0 0 auto}
.reader-head-copy{min-width:0}
.reader-head-copy b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.reader-head-copy span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.reader-article h1{font-size:clamp(34px,10vw,48px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}
.reader-article .reader-lede{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 24px}
.reader-body{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.68;letter-spacing:-.008em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.reader-body p{margin:0 0 20px}
.reader-start-quiz{margin:28px 0 18px}
.reader-question-wrap{padding-top:6px}
.reader-question{font-size:clamp(26px,7.5vw,34px);line-height:1.16;letter-spacing:-.04em;margin:26px 0 24px;font-weight:720}
.reader-options{display:grid;gap:10px}
.reader-option{width:100%;border:1px solid var(--line);border-radius:17px;background:var(--card);color:var(--text);padding:16px 17px;text-align:left;font-weight:650;line-height:1.35;min-height:56px}
.reader-option.correct{background:#e7efe9;border-color:#d7e6db}
.reader-option.wrong{background:#f4e8e5;border-color:#ead6d2;color:var(--danger)}
.reader-option.dim{opacity:.58}
.reader-feedback{margin-top:18px;border-radius:17px;padding:15px 16px;line-height:1.45;font-size:14px}
.reader-feedback.ok{background:#e7efe9}
.reader-feedback.bad{background:#f4e8e5}
.reader-next{margin-top:12px}
.reader-result{padding-top:5vh}
.reader-score{font-size:72px;line-height:.9;font-weight:780;letter-spacing:-.07em;margin:22px 0 10px}
.reader-score span{font-size:20px;color:var(--muted);font-weight:650;letter-spacing:0}
.reader-result p{color:var(--muted);font-size:16px;line-height:1.5}
.reader-result-actions{display:grid;gap:10px;margin-top:28px}
@media(max-width:380px){.reader-body{font-size:18px}.reader-question{margin-top:20px}.reader-card{padding:17px}}


/* v0.14: Pronounce over secure HTTPS; no keyboard-dictation fallback */
.pronounce-home-card{margin-top:12px;display:grid;gap:14px}
.pronounce-home-copy{color:var(--muted);font-size:14px;line-height:1.45;margin:0}
.pronounce-metric{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pronounce-metric span{color:var(--muted);font-size:13px}
.pronounce-metric b{font-size:28px;letter-spacing:-.04em}
.pronounce-stage{display:grid;gap:14px;margin-top:12px}
.pronounce-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pronounce-btn{min-height:62px;border-radius:20px;border:1px solid var(--line);font-weight:760;background:var(--card);color:var(--text)}
.pronounce-btn.primary-mic{background:var(--text);color:#fff;border-color:var(--text)}
.pronounce-btn:disabled{opacity:.48}
.pronounce-status{min-height:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
.pronounce-status.live{color:var(--accent);font-weight:700}
.pronounce-status.error{color:var(--danger)}
.pronounce-heard{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--card);font-size:16px}
.pronounce-heard small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:750;margin-bottom:5px}
.pronounce-result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:380px){.pronounce-btn{min-height:56px}.pronounce-controls,.pronounce-result-actions{gap:8px}}

/* v0.15: Wrong Book — recurrent Word/Sentence errors */
.wrong-section{display:grid;gap:10px;margin:22px 0 30px}
.forget-section-note{font-size:13px;color:var(--muted);line-height:1.45;margin:-2px 2px 2px}
.forget-divider{height:1px;background:var(--line);margin:4px 0}
.wrong-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
.wrong-section-head h2{font-size:18px;margin:0;letter-spacing:-.025em}
.wrong-section-head span{font-size:13px;color:var(--muted)}
.wrong-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;display:grid;gap:11px}
.wrong-card.recurrent{border-color:#e5c9c3}
.wrong-card.resolved{opacity:.72}
.wrong-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wrong-title{font-size:18px;font-weight:740;line-height:1.25;letter-spacing:-.025em}

const SQLiteStore = {
  SQL:null,
  db:null,
  readyPromise:null,
  writeQueue:Promise.resolve(),
  containerName:'noma-sqlite-container-v1',
  storeName:'files',
  dbKey:'noma-beta.sqlite',
  cdnBase:'https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/',

  async loadLibrary(){
    if(window.initSqlJs) return window.initSqlJs;
    await new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=this.cdnBase+'sql-wasm.min.js';
      script.async=true;
      script.onload=resolve;
      script.onerror=()=>reject(new Error('No se pudo cargar SQLite'));
      document.head.appendChild(script);
    });
    if(typeof window.initSqlJs!=='function') throw new Error('SQLite no se inicializó');
    return window.initSqlJs;
  },

  openContainer(){
    return new Promise((resolve,reject)=>{
      const request=indexedDB.open(this.containerName,1);
      request.onupgradeneeded=()=>request.result.createObjectStore(this.storeName);
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error||new Error('IndexedDB no disponible'));
    });
  },

  async readFile(){
    const idb=await this.openContainer();
    try{
      return await new Promise((resolve,reject)=>{
        const tx=idb.transaction(this.storeName,'readonly');
        const req=tx.objectStore(this.storeName).get(this.dbKey);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>reject(req.error);
      });
    } finally { idb.close(); }
  },

  async writeFile(bytes){
    const idb=await this.openContainer();
    try{
      await new Promise((resolve,reject)=>{
        const tx=idb.transaction(this.storeName,'readwrite');
        tx.objectStore(this.storeName).put(bytes,this.dbKey);
        tx.oncomplete=resolve;
        tx.onerror=()=>reject(tx.error);
        tx.onabort=()=>reject(tx.error||new Error('No se pudo guardar SQLite'));
      });
    } finally { idb.close(); }
  },

  async ensure(){
    if(this.readyPromise) return this.readyPromise;
    this.readyPromise=(async()=>{
      const initSqlJs=await this.loadLibrary();
      this.SQL=await initSqlJs({locateFile:filename=>this.cdnBase+filename});
      const stored=await this.readFile();
      this.db=stored ? new this.SQL.Database(new Uint8Array(stored)) : new this.SQL.Database();
      this.db.run(`CREATE TABLE IF NOT EXISTS app_state (
        id INTEGER PRIMARY KEY CHECK (id = 1),
        state_schema INTEGER NOT NULL,
        payload TEXT NOT NULL,
        updated_at INTEGER NOT NULL
      )`);
      this.db.run('CREATE TABLE IF NOT EXISTS meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)');
      this.db.run('PRAGMA user_version = '+SQLITE_DB_SCHEMA_VERSION);
      return true;
    })();
    return this.readyPromise;
  },

  async load(){
    await this.ensure();
    const stmt=this.db.prepare('SELECT payload, updated_at, state_schema FROM app_state WHERE id = 1');
    try{
      if(!stmt.step()) return {payload:null,updatedAt:0,stateSchema:null,dbSchema:SQLITE_DB_SCHEMA_VERSION};
      const row=stmt.getAsObject();
      return {payload:row.payload,updatedAt:Number(row.updated_at)||0,stateSchema:Number(row.state_schema)||null,dbSchema:SQLITE_DB_SCHEMA_VERSION};
    } finally { stmt.free(); }
  },

  save(json,stateSchema,updatedAt){
    this.writeQueue=this.writeQueue.then(async()=>{
      await this.ensure();
      this.db.run(`
        INSERT INTO app_state(id,state_schema,payload,updated_at)
        VALUES(1,?,?,?)
        ON CONFLICT(id) DO UPDATE SET
          state_schema=excluded.state_schema,
          payload=excluded.payload,
          updated_at=excluded.updated_at
      `,[Number(stateSchema)||0,String(json),Number(updatedAt)||Date.now()]);
      await this.writeFile(this.db.export());
      return true;
    });
    return this.writeQueue;
  },

  async integrity(){
    await this.ensure();
    const result=this.db.exec('PRAGMA integrity_check');
    return result?.[0]?.values?.[0]?.[0]||'unknown';
  }
};

function localCandidate(){
  try{
    const emergencyRaw=localStorage.getItem(EMERGENCY_STORAGE_KEY);
    if(emergencyRaw){
      const envelope=JSON.parse(emergencyRaw);
      if(envelope?.state?.units?.length===PACK_SIZE){
        return {state:envelope.state,updatedAt:Number(envelope.updatedAt)||0,source:'emergency'};
      }
    }
  }catch(e){}
  try{
    const legacyRaw=localStorage.getItem(STORAGE_KEY);
    if(legacyRaw){
      const legacy=JSON.parse(legacyRaw);
      if(legacy?.units?.length===PACK_SIZE) return {state:legacy,updatedAt:0,source:'legacy'};
    }
  }catch(e){}
  return null;
}

const Storage = {
  mode:'starting',
  dbSchema:null,
  integrity:null,
  persistentStorage:null,
  lastError:null,
  async load(){
    const local=localCandidate();
    try{
      const dbRecord=await SQLiteStore.load();
      this.dbSchema=dbRecord?.dbSchema||SQLITE_DB_SCHEMA_VERSION;
      let dbState=null;
      if(dbRecord?.payload){
        try{ dbState=JSON.parse(dbRecord.payload); }catch(e){}
      }
      const dbCandidate=dbState?.units?.length===PACK_SIZE
        ? {state:dbState,updatedAt:Number(dbRecord.updatedAt)||0,source:'sqlite'}
        : null;
      const chosen=local && (!dbCandidate || local.updatedAt>dbCandidate.updatedAt) ? local : dbCandidate;
      if(chosen?.source!=='sqlite' && chosen){
        await SQLiteStore.save(JSON.stringify(chosen.state),chosen.state.schemaVersion||STATE_SCHEMA_VERSION,Date.now());
      }
      try{ this.integrity=await SQLiteStore.integrity(); }catch(e){}
      try{ this.persistentStorage=await navigator.storage?.persist?.(); }catch(e){ this.persistentStorage=null; }
      this.mode='sqlite';
      this.lastError=null;
      return chosen?.state||null;
    }catch(error){
      this.mode='local-fallback';
      this.lastError=error?.message||String(error);
      if(local?.state) return local.state;
      throw new Error('No se pudo abrir SQLite y no hay una copia local de recuperación. Noma no iniciará un progreso vacío para proteger tus datos.');
    }
  },
  save(value){
    const snapshot=JSON.parse(JSON.stringify(value));
    const updatedAt=Date.now();
    try{
      localStorage.setItem(EMERGENCY_STORAGE_KEY,JSON.stringify({updatedAt,state:snapshot}));
    }catch(e){}
    if(this.mode==='sqlite'){
      SQLiteStore.save(JSON.stringify(snapshot),snapshot.schemaVersion||STATE_SCHEMA_VERSION,updatedAt)
        .catch(error=>{this.lastError=error?.message||String(error);});
    }
  }
};

function backupLabel(){
  if(!state?.lastBackupAt) return 'Copia externa: todavía no';
  return 'Última copia externa: '+new Date(state.lastBackupAt).toLocaleDateString();
}
function persistenceLabel(){
  if(Storage.mode==='sqlite'){
    const durable=Storage.persistentStorage===true?' · persistencia reforzada':'';
    const ok=Storage.integrity==='ok'?' · integridad OK':'';
    return `SQLite local · DB v${Storage.dbSchema||SQLITE_DB_SCHEMA_VERSION}${durable}${ok}`;
  }
  return 'Modo de recuperación local · SQLite no disponible';
}

let state = null;
async function load(){
  const x=await Storage.load();

function migrateState(x){
  x.schemaVersion = Number.isFinite(x.schemaVersion) ? x.schemaVersion : 1;
  x.sessionNumber = Number.isFinite(x.sessionNumber) ? x.sessionNumber : 0;
  x.practiceMode = ['word','sentence','mix'].includes(x.practiceMode) ? x.practiceMode : 'mix';
  x.readerProgress = x.readerProgress && typeof x.readerProgress==='object' ? x.readerProgress : {};
  x.readerSession = null;
  x.wrongBook = x.wrongBook && typeof x.wrongBook==='object' ? x.wrongBook : {};
  x.lastBackupAt = Number.isFinite(x.lastBackupAt) ? x.lastBackupAt : null;
  if(['reader','readerLibrary'].includes(x.screen)) x.screen='home';
  x.units = x.units.map(u => {
    const canonical=baseUnits.find(item=>item.id===u.id)||u;
    let dueSession = Number.isFinite(u.dueSession) ? u.dueSession : (u.due ? x.sessionNumber + 1 : null);
    let reviewKind = u.reviewKind || (u.due || u.status==='unstable' ? 'forget' : null);
    let reviewMode = u.reviewMode || 'word';
    // Units successfully introduced in v0.1 had no delayed recall at all.
    // Queue them gradually instead of replaying their sentence every session.
    if(dueSession==null && u.status==='learning' && (u.recognition||0)>=1 && (u.production||0)>=1 && (u.recall||0)<1){
      dueSession=x.sessionNumber+2;
      reviewKind='verify';
    }
    return {...u,...canonical,dueSession,reviewKind,reviewMode,lastSessionSeen:Number.isFinite(u.lastSessionSeen)?u.lastSessionSeen:null,
      listenAttempts:Number.isFinite(u.listenAttempts)?u.listenAttempts:0,
      listenCorrect:Number.isFinite(u.listenCorrect)?u.listenCorrect:0,
      listenMistakes:Number.isFinite(u.listenMistakes)?u.listenMistakes:0,
      listenFirstResult:(u.listenFirstResult===true||u.listenFirstResult===false)?u.listenFirstResult:null,
      listenDueSession:Number.isFinite(u.listenDueSession)?u.listenDueSession:null,
      listenLastSeen:Number.isFinite(u.listenLastSeen)?u.listenLastSeen:null,
      listenLastSessionSeen:Number.isFinite(u.listenLastSessionSeen)?u.listenLastSessionSeen:null,
      pronounceAttempts:Number.isFinite(u.pronounceAttempts)?u.pronounceAttempts:0,
      pronounceCorrect:Number.isFinite(u.pronounceCorrect)?u.pronounceCorrect:0,
      pronounceMistakes:Number.isFinite(u.pronounceMistakes)?u.pronounceMistakes:0,
      pronounceFirstResult:(u.pronounceFirstResult===true||u.pronounceFirstResult===false)?u.pronounceFirstResult:null,
      pronounceDueSession:Number.isFinite(u.pronounceDueSession)?u.pronounceDueSession:null,
      pronounceLastSeen:Number.isFinite(u.pronounceLastSeen)?u.pronounceLastSeen:null,
      pronounceLastSessionSeen:Number.isFinite(u.pronounceLastSessionSeen)?u.pronounceLastSessionSeen:null};
  });
  // Sessions from the first prototype can contain tasks created with the old repeat logic.
  // Discard only the in-progress session; all learning progress is preserved.
  x.session = null;
  if(x.screen==='exercise') x.screen='home';
  return x;
}
function save(){ state.schemaVersion=STATE_SCHEMA_VERSION; Storage.save(state); }
function normalize(s=''){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
}
function escapeHtml(s=''){return s.replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function knownCount(){ return state.units.filter(u=>u.status==='known').length; }
// Practice progress is tracked separately for Word and Sentence.
// "Combined" means the same pack unit has evidence in both modes.
function wordProgressCount(){ return state.units.filter(u=>(u.recognition||0)>=1 && u.status!=='unstable').length; }
function sentenceProgressCount(){ return state.units.filter(u=>(u.production||0)>=1 && u.status!=='unstable').length; }
function combinedProgressCount(){ return state.units.filter(u=>(u.recognition||0)>=1 && (u.production||0)>=1 && u.status!=='unstable').length; }
function learnedCount(){ return combinedProgressCount(); }
function modeProgressCount(mode=state.practiceMode||'mix'){
  if(mode==='word') return wordProgressCount();
  if(mode==='sentence') return sentenceProgressCount();
  return combinedProgressCount();
}
function modeLeftCount(mode=state.practiceMode||'mix'){ return PACK_SIZE - modeProgressCount(mode); }

function progressSnapshot(){ return {word:wordProgressCount(),sentence:sentenceProgressCount(),combined:combinedProgressCount()}; }
function textForgetCount(){ return state.units.filter(u=>u.reviewKind==='forget' && u.dueSession!=null).length; }

function unstableCount(){
  const keys=new Set();
  for(const u of state.units){
    if(u.reviewKind==='forget' && u.dueSession!=null) keys.add(`text:${u.id}:${u.reviewMode||'word'}`);
    if(u.listenDueSession!=null) keys.add(`listen:${u.id}`);
    if(u.pronounceDueSession!=null) keys.add(`pronounce:${u.id}`);
  }
  for(const e of wrongEntries()){
    if(!e.resolvedAt && (e.failures||0)>=2) keys.add(`text:${e.unitId}:${e.mode}`);

function wrongKey(u,mode){ return `${u.id}:${mode}`; }
function recordWrong(u,mode,answer=''){
  if(!['word','sentence'].includes(mode)) return;
  state.wrongBook = state.wrongBook || {};
  const key=wrongKey(u,mode), prev=state.wrongBook[key]||{};
  state.wrongBook[key]={
    unitId:u.id,
    mode,
    failures:(prev.failures||0)+1,
    successesAfterFailure:0,
    lastWrongAt:Date.now(),
    lastRightAt:prev.lastRightAt||null,
    lastAnswer:String(answer||'').trim(),
    resolvedAt:null
  };
}
function recordRight(u,mode){
  if(!['word','sentence'].includes(mode) || !state.wrongBook) return;
  const key=wrongKey(u,mode), entry=state.wrongBook[key];
  if(!entry || entry.resolvedAt) return;
  entry.successesAfterFailure=(entry.successesAfterFailure||0)+1;
  entry.lastRightAt=Date.now();
  if(entry.successesAfterFailure>=2) entry.resolvedAt=Date.now();
}
function wrongEntries(){
  return Object.values(state.wrongBook||{}).filter(e=>e&&getUnit(e.unitId)&&['word','sentence'].includes(e.mode));
}
function recurrentWrongCount(){ return wrongEntries().filter(e=>!e.resolvedAt&&(e.failures||0)>=2).length; }
function observedWrongCount(){ return wrongEntries().filter(e=>!e.resolvedAt&&(e.failures||0)===1).length; }

function maybeKnown(u){
  if(u.recognition>=1 && u.production>=1 && u.recall>=1){
    u.status='known'; u.due=false; u.dueSession=null; u.reviewKind=null;

function scheduleReview(u, delay, kind, mode){
  const target=(state.sessionNumber||0)+delay;

  u.dueSession = u.dueSession==null ? target : Math.min(u.dueSession,target);
  u.reviewKind = kind==='forget' ? 'forget' : (u.reviewKind || kind);
  if(mode) u.reviewMode=mode;
  u.due=true;

function markSuccess(u, kind){

function scheduleListenReview(u, delay){

function markListenSuccess(u){

}
function restoreUnit(u,snap){ Object.assign(u,snap); }
function getUnit(id){ return state.units.find(u=>u.id===id); }

function shuffleTasks(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function availableForPractice(u){
  return !(u.reviewKind==='forget' && u.dueSession!=null);
}
function setPracticeMode(mode){
  if(!['word','sentence','mix'].includes(mode)) return;
  state.practiceMode=mode; save(); render();

function dueForMode(u, mode){
  if(u.dueSession==null || u.dueSession>state.sessionNumber || u.status==='known') return false;
  const reviewMode=u.reviewMode||'word';
  if(mode==='mix') return true;
  return reviewMode===mode;
}
const PRACTICE_SESSION_SIZE = 10;

function buildSession(){
  const mode=state.practiceMode||'mix';
  state.sessionNumber=(state.sessionNumber||0)+1;
  const due = state.units
    .filter(u=>dueForMode(u,mode))
    .sort((a,b)=>(a.dueSession-b.dueSession)||((a.lastSeen||0)-(b.lastSeen||0)))
    .slice(0,2);

  const tasks=due.map(u=>({type:'recall', unitId:u.id, reviewKind:u.reviewKind||'verify', reviewMode:u.reviewMode||'word'}));
  const used=new Set(due.map(u=>u.id));

  const addWords=(count)=>{
    for(const u of state.units){
      if(count<=0) break;
      if(!used.has(u.id) && u.recognition<1 && availableForPractice(u)){
        tasks.push({type:'word',unitId:u.id}); used.add(u.id); count--;
      }
    }
  };
  const addSentences=(count)=>{
    for(const u of state.units){
      if(count<=0) break;
      if(!used.has(u.id) && u.production<1 && availableForPractice(u)){
        tasks.push({type:'sentence',unitId:u.id}); used.add(u.id); count--;
      }
    }
  };

  if(mode==='word') addWords(Math.max(0,PRACTICE_SESSION_SIZE-tasks.length));
  else if(mode==='sentence') addSentences(Math.max(0,PRACTICE_SESSION_SIZE-tasks.length));
  else {
    const remaining=Math.max(0,PRACTICE_SESSION_SIZE-tasks.length);
    const wordTarget=Math.ceil(remaining/2);
    const sentenceTarget=Math.floor(remaining/2);
    addWords(wordTarget);
    addSentences(sentenceTarget);
    // If one side has run out of unseen items, fill the remaining slots from the other.
    if(tasks.length<PRACTICE_SESSION_SIZE) addWords(PRACTICE_SESSION_SIZE-tasks.length);
    if(tasks.length<PRACTICE_SESSION_SIZE) addSentences(PRACTICE_SESSION_SIZE-tasks.length);
  }

  const mixed=shuffleTasks(tasks).slice(0,PRACTICE_SESSION_SIZE);
  if(!mixed.length){
    state.lastSessionSummary={before:leftCount(),after:leftCount(),strengthened:0,mistakes:0,duration:0};
    state.screen='done'; save(); render(); return;
  }
  state.session = { number:state.sessionNumber, mode, tasks:mixed, index:0, before:leftCount(), beforeProgress:progressSnapshot(), strengthened:0, mistakes:0, startedAt:Date.now(), response:null, listenPlayed:false, listenError:null };
  state.screen='exercise'; save(); render();
  requestAnimationFrame(()=>window.scrollTo(0,0));
}

function buildListenSession(){
  state.sessionNumber=(state.sessionNumber||0)+1;
  const due=state.units
    .filter(u=>u.listenDueSession!=null && u.listenDueSession<=state.sessionNumber)
    .sort((a,b)=>(a.listenDueSession-b.listenDueSession)||((a.listenLastSeen||0)-(b.listenLastSeen||0)))
    .slice(0,2);
  const tasks=due.map(u=>({type:'listen',unitId:u.id,reviewKind:'forget-listen'}));
  const used=new Set(due.map(u=>u.id));
  const candidates=state.units
    .filter(u=>!used.has(u.id) && u.listenDueSession==null && (u.lastSessionSeen==null || u.lastSessionSeen<state.sessionNumber-1))
    .sort((a,b)=>(a.listenAttempts||0)-(b.listenAttempts||0)||((a.listenLastSeen||0)-(b.listenLastSeen||0)));
  for(const u of candidates){
    if(tasks.length>=4) break;
    tasks.push({type:'listen',unitId:u.id,reviewKind:'listen'}); used.add(u.id);
  }
  // If the recent-session guard leaves too few candidates, fill from any non-pending item.
  if(tasks.length<4){
    for(const u of state.units){
      if(tasks.length>=4) break;
      if(!used.has(u.id) && u.listenDueSession==null){tasks.push({type:'listen',unitId:u.id,reviewKind:'listen'});used.add(u.id);}
    }
  }
  const mixed=shuffleTasks(tasks).slice(0,4);
  if(!mixed.length){
    state.lastSessionSummary={before:leftCount(),after:leftCount(),strengthened:0,mistakes:0,duration:0,mode:'listen'};
    state.screen='done'; save(); render(); return;
  }
  state.session={number:state.sessionNumber,mode:'listen',tasks:mixed,index:0,before:leftCount(),beforeProgress:progressSnapshot(),strengthened:0,mistakes:0,startedAt:Date.now(),response:null,listenPlayed:false,listenError:null};
  state.screen='exercise'; save(); render();
  requestAnimationFrame(()=>window.scrollTo(0,0));
}

function buildPronounceSession(){
  state.sessionNumber=(state.sessionNumber||0)+1;
  const due=state.units
    .filter(u=>u.pronounceDueSession!=null && u.pronounceDueSession<=state.sessionNumber)
    .sort((a,b)=>(a.pronounceDueSession-b.pronounceDueSession)||((a.pronounceLastSeen||0)-(b.pronounceLastSeen||0)))
    .slice(0,2);
  const tasks=due.map(u=>({type:'pronounce',unitId:u.id,reviewKind:'forget-pronounce'}));
  const used=new Set(due.map(u=>u.id));
  let candidates=state.units
    .filter(u=>!used.has(u.id) && u.pronounceDueSession==null && (u.recognition>0 || u.production>0 || u.listenAttempts>0))
    .sort((a,b)=>(a.pronounceAttempts||0)-(b.pronounceAttempts||0)||((a.pronounceLastSeen||0)-(b.pronounceLastSeen||0)));
  if(candidates.length<4) candidates=candidates.concat(state.units.filter(u=>!used.has(u.id)&&u.pronounceDueSession==null&&!candidates.includes(u)));
  for(const u of candidates){
    if(tasks.length>=4) break;
    tasks.push({type:'pronounce',unitId:u.id,reviewKind:'pronounce'}); used.add(u.id);
  }
  if(!tasks.length){ state.screen='home'; save(); render(); return; }
  state.session={number:state.sessionNumber,mode:'pronounce',tasks:shuffleTasks(tasks).slice(0,4),index:0,before:leftCount(),beforeProgress:progressSnapshot(),strengthened:0,mistakes:0,startedAt:Date.now(),response:null,listenPlayed:false,listenError:null,pronounceListening:false,pronounceError:null,pronounceFailureRecorded:false};
  state.screen='exercise'; save(); render(); requestAnimationFrame(()=>window.scrollTo(0,0));
}

function levenshtein(a,b){
  const prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++) cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    for(let j=0;j<cur.length;j++) prev[j]=cur[j];
  }
  return prev[b.length];
}
function acceptedMeanings(u){
  const fromMeaning=u.meaning.split('/').map(x=>x.trim()).filter(Boolean);
  const aliases=WORD_ALIASES[u.term]||[];
  return [...new Set([...fromMeaning,...aliases].map(normalize).filter(Boolean))];
}
function meaningMatches(answer, u){
  const ans=normalize(answer);
  if(ans.length<2) return false;
  return acceptedMeanings(u).some(x=>{
    if(ans===x) return true;
    if(Math.min(ans.length,x.length)>=5 && levenshtein(ans,x)<=1) return true;
    // Multi-word equivalents can contain an optional article/pronoun without being rejected.
    const A=ans.split(' ').filter(w=>w.length>1), B=x.split(' ').filter(w=>w.length>1);
    if(A.length>1 && B.length>1){
      const common=B.filter(w=>A.includes(w)).length;
      if(common/B.length>=0.8 && common/A.length>=0.65) return true;
    }
    return false;
  });
}
function clozeData(u){
  if(CLOZE_OVERRIDES[u.term]) return {...CLOZE_OVERRIDES[u.term], es:CLOZE_OVERRIDES[u.term].es||u.es};
  const source=u.en, lower=source.toLowerCase(), needle=u.term.toLowerCase();
  const idx=lower.indexOf(needle);
  if(idx>=0){
    return {prompt:source.slice(0,idx)+'_____'+source.slice(idx+needle.length), answer:u.term, es:u.es};
  }
  return {prompt:u.en, answer:u.term, es:u.es};
}

function normalizeEnglish(s=''){
  let n=normalize(s);
  const reps=[
    ["i'm",'i am'],["you're",'you are'],["we're",'we are'],["they're",'they are'],["he's",'he is'],["she's",'she is'],["it's",'it is'],
    ["don't",'do not'],["doesn't",'does not'],["didn't",'did not'],["can't",'cannot'],["won't",'will not'],["haven't",'have not'],["hasn't",'has not'],
    ["i'll",'i will'],["you'll",'you will'],["we'll",'we will'],["they'll",'they will'],["i've",'i have'],["we've",'we have'],["i'd",'i would']
  ];
  for(const [a,b] of reps) n=n.replaceAll(a,b);

}

let activeSpeechStop=null;
let activeMediaStop=null;
let activeUtterance=null;
function cancelEnglishSpeech(){
  if(activeMediaStop){const stop=activeMediaStop;activeMediaStop=null;stop();}
  if(activeSpeechStop){const stop=activeSpeechStop;activeSpeechStop=null;stop();}
  activeUtterance=null;

    try{if(window.speechSynthesis.speaking||window.speechSynthesis.pending)window.speechSynthesis.cancel();}catch(e){}
  }
}
function chooseEnglishVoice(){
  if(!('speechSynthesis' in window))return null;
  const voices=window.speechSynthesis.getVoices()||[];
  const english=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('en'));
  return english.find(v=>v.localService&&(v.lang||'').toLowerCase().startsWith('en-gb'))
    || english.find(v=>v.localService)
    || english.find(v=>(v.lang||'').toLowerCase().startsWith('en-gb'))
    || english[0] || null;
}
function speakEnglish(text,rate,{onStart=()=>{},onEnd=()=>{},onError=()=>{}}={}){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    onError('no-web-speech');return;
  }
  cancelEnglishSpeech();
  const synth=window.speechSynthesis,utter=new SpeechSynthesisUtterance(text);
  const voice=chooseEnglishVoice();
  if(voice){utter.voice=voice;utter.lang=voice.lang;}else{utter.lang='en-GB';}

  let active=true,started=false,watchdog=null;
  const clear=()=>{if(watchdog!==null){clearTimeout(watchdog);watchdog=null;}};
  const stop=()=>{active=false;clear();if(activeUtterance===utter)activeUtterance=null;};
  const finish=()=>{if(!active)return false;stop();if(activeSpeechStop===stop)activeSpeechStop=null;return true;};
  const fail=code=>{if(finish())onError(code||'unknown-tts');};
  utter.onstart=()=>{
    if(!active)return;
    started=true;clear();onStart();
    watchdog=setTimeout(()=>{try{synth.cancel();}catch(e){}fail('tts-ended-timeout');},
      Math.max(12000,text.length*250));
  };
  utter.onend=()=>{if(finish())onEnd();};
  utter.onerror=event=>fail(event?.error||'tts-error');
  activeSpeechStop=stop;activeUtterance=utter;
  try{
    if(synth.paused)synth.resume();
    synth.speak(utter);
    watchdog=setTimeout(()=>{
      if(active&&!started){try{synth.cancel();}catch(e){}fail('tts-start-timeout');}
    },6500);

}
function audioClip(kind,id){return './audio/'+kind+'/'+encodeURIComponent(String(id))+'.mp3';}
// Static MP3 playback is independent of the Web Speech engine on Android.
function playBundledAudio(path,{onStart=()=>{},onEnd=()=>{},onError=()=>{}}={}){
  cancelEnglishSpeech();
  const player=new Audio(path);
  player.preload='auto';
  let active=true,started=false,watchdog=null;
  const clear=()=>{if(watchdog!==null){clearTimeout(watchdog);watchdog=null;}};
  const stop=()=>{
    if(!active)return;
    active=false;clear();
    player.onplaying=null;player.onended=null;player.onerror=null;
    try{player.pause();player.removeAttribute('src');player.load();}catch(e){}
  };
  const finish=()=>{
    if(!active)return false;
    active=false;clear();
    player.onplaying=null;player.onended=null;player.onerror=null;
    if(activeMediaStop===stop)activeMediaStop=null;
    return true;
  };
  const fail=code=>{if(finish())onError(code);};
  activeMediaStop=stop;
  player.onplaying=()=>{
    if(!active||started)return;
    started=true;clear();onStart();
  };
  player.onended=()=>{
    if(!active)return;
    if(!started){started=true;onStart();}
    if(finish())onEnd();
  };
  player.onerror=()=>fail('media-error-'+(player.error?.code||'unknown'));
  try{
    const pending=player.play(); // Called directly inside tap event.
    pending?.catch?.(e=>fail(e?.name||e?.message||'play-rejected'));

  }catch(e){fail(e?.name||e?.message||'play-exception');}

function startPronounceRecognition(){

  const env=speechEnvironmentStatus();
  if(!env.ok){ setPronounceError(env.message); return; }
  const SR=env.SR;
  try{
    if(activeRecognition){try{activeRecognition.abort();}catch(e){}}
    const recognition=new SR(); activeRecognition=recognition;
    recognition.lang='en-GB'; recognition.continuous=false; recognition.interimResults=false; recognition.maxAlternatives=5;
    s.pronounceListening=true; s.pronounceError=null; save(); render();
    recognition.onresult=(event)=>{
      const taskNow=currentTask(); if(!taskNow||taskNow.type!=='pronounce') return;
      const u=getUnit(taskNow.unitId); const alternatives=[];
      const result=event.results?.[0];
      if(result){ for(let i=0;i<result.length;i++) alternatives.push(result[i].transcript||''); }
      const heard=alternatives[0]||''; const ok=alternatives.some(x=>pronounceMatches(x,u.term));

      const code=event?.error||'';
      if(code==='no-speech'){ setPronounceError('No he oído nada. Inténtalo otra vez.'); return; }
      if(code==='not-allowed'||code==='service-not-allowed'){ setPronounceError('Permite el acceso al micrófono de Noma en Chrome y vuelve a intentarlo.'); return; }
      if(code==='network'){ setPronounceError('El servicio de reconocimiento de voz no está disponible ahora. Inténtalo de nuevo más tarde.'); return; }
      setPronounceError('No se ha podido iniciar el reconocimiento. Inténtalo otra vez.');
    };

      if(activeRecognition===recognition) activeRecognition=null;
      if(state.session?.pronounceListening){ state.session.pronounceListening=false; save(); render(); }
    };

  }catch(e){
    activeRecognition=null; s.pronounceListening=false;
    s.pronounceError='No se ha podido abrir el micrófono. Comprueba que Noma está abierta por HTTPS y que Chrome tiene permiso.';
    save(); render();
  }
}

    <div class="stat-grid"><div class="stat"><b>${learned}</b><span>Word + Sentence</span></div><div class="stat"><b>${known}</b><span>Memoria confirmada</span></div><div class="stat"><b>${unstable}</b><span>Forget Me</span></div><div class="stat"><b>${mistakes}</b><span>Fallos registrados</span></div></div>
    <div class="card" style="margin:14px 0"><div class="session-title"><strong>${listenStats.pct==null?'—':listenStats.pct+'%'}</strong><span>first-listen comprehension</span></div><p class="note" style="margin-bottom:0">${listenStats.attempted?`${listenStats.correct} de ${listenStats.attempted} frases nuevas entendidas a la primera.`:'Todavía no has hecho Listen Once.'}</p></div>
    <div class="card" style="margin:14px 0"><div class="session-title"><strong>${pronounceStats.pct==null?'—':pronounceStats.pct+'%'}</strong><span>pronounce recognizability</span></div><p class="note" style="margin-bottom:0">${pronounceStats.attempted?`${pronounceStats.correct} de ${pronounceStats.attempted} palabras nuevas reconocidas a la primera.`:'Todavía no has hecho Pronounce.'}</p></div>
    <div class="card" style="margin:14px 0"><div class="session-title"><strong>${Object.values(state.readerProgress||{}).filter(x=>x.attempts>0).length} / ${READER_TEXTS.length}</strong><span>Tiny Reader</span></div><p class="note" style="margin-bottom:0">Textos de prueba completados. Las preguntas de lectura no alteran el contador de palabras.</p></div>
    <div class="list"><div class="list-item"><span>Reconocimiento</span><span>${state.units.reduce((a,u)=>a+u.recognition,0)}</span></div><div class="list-item"><span>Producción</span><span>${state.units.reduce((a,u)=>a+u.production,0)}</span></div><div class="list-item"><span>Recalls superados</span><span>${state.units.reduce((a,u)=>a+u.recall,0)}</span></div><div class="list-item"><span>Errores recurrentes</span><span>${recurrentWrongCount()}</span></div><div class="list-item"><span>Errores resueltos</span><span>${resolvedWrongCount()}</span></div><div class="list-item"><span>Listen Once correctos</span><span>${state.units.reduce((a,u)=>a+(u.listenCorrect||0),0)}</span></div><div class="list-item"><span>Pronounce reconocidos</span><span>${state.units.reduce((a,u)=>a+(u.pronounceCorrect||0),0)}</span></div></div>

    ${renderNav('progress')}`;
}

function forgetMe(){
  const now=state.sessionNumber||0;
  const recurrent=wrongEntries()
    .filter(e=>!e.resolvedAt&&(e.failures||0)>=2)
    .sort((a,b)=>{
      const ai=(a.successesAfterFailure||0)>0, bi=(b.successesAfterFailure||0)>0;
      if(ai!==bi) return ai?1:-1;
      if((b.failures||0)!==(a.failures||0)) return (b.failures||0)-(a.failures||0);
      return (b.lastWrongAt||0)-(a.lastWrongAt||0);
    });
  const recurrentKeys=new Set(recurrent.map(e=>`${e.unitId}:${e.mode}`));
  const resolved=wrongEntries()
    .filter(e=>!!e.resolvedAt&&(e.failures||0)>=2)
    .sort((a,b)=>(b.resolvedAt||0)-(a.resolvedAt||0));

  const pending=[];
  for(const u of state.units){
    if(u.reviewKind==='forget' && u.dueSession!=null){
      const mode=u.reviewMode||'word';
      if(!recurrentKeys.has(`${u.id}:${mode}`)) pending.push({due:u.dueSession,type:'text',mode,u});
    }
    if(u.listenDueSession!=null) pending.push({due:u.listenDueSession,type:'listen',u});
    if(u.pronounceDueSession!=null) pending.push({due:u.pronounceDueSession,type:'pronounce',u});
  }
  pending.sort((a,b)=>(a.due-b.due)||((b.u.mistakes||0)+(b.u.listenMistakes||0)+(b.u.pronounceMistakes||0)-(a.u.mistakes||0)-(a.u.listenMistakes||0)-(a.u.pronounceMistakes||0)));

  const whenText=(due)=>{
    if(due==null) return 'en seguimiento';
    const delta=Math.max(0,due-now);
    return delta<=1?'próxima sesión':`en ${delta} sesiones`;
  };

  const pendingHtml=pending.length?pending.map(({due,type,mode,u})=>{
    const when=whenText(due);
    if(type==='listen'){
      return `<details class="forget-item"><summary><span><b>${escapeHtml(u.term)}</b><small>Listen Once · ${u.listenMistakes||0} fallo${(u.listenMistakes||0)===1?'':'s'}</small></span><em>${when}</em></summary><div class="forget-detail"><span class="listen-badge">AUDIO</span><p>${escapeHtml(u.en)}</p><small>${escapeHtml(u.es)}</small></div></details>`;
    }
    if(type==='pronounce'){
      return `<details class="forget-item"><summary><span><b>${escapeHtml(u.term)}</b><small>Pronounce · ${u.pronounceMistakes||0} fallo${(u.pronounceMistakes||0)===1?'':'s'}</small></span><em>${when}</em></summary><div class="forget-detail"><span class="listen-badge">VOICE</span><p>Vuelve a pronunciarla para comprobar que el reconocimiento la entiende.</p></div></details>`;
    }
    const kind=mode==='sentence'?'Sentence':'Word';
    return `<details class="forget-item"><summary><span><b>${escapeHtml(u.term)}</b><small>${kind} · ${u.mistakes} fallo${u.mistakes===1?'':'s'}</small></span><em>${when}</em></summary><div class="forget-detail"><strong>${escapeHtml(u.meaning)}</strong><p>${escapeHtml(u.en)}</p><small>${escapeHtml(u.es)}</small></div></details>`;
  }).join(''):`<div class="wrong-empty"><b>Nada pendiente ahora.</b><br>Los fallos nuevos de Word, Sentence, Listen Once o Pronounce aparecerán aquí hasta que toque recuperarlos.</div>`;

  function patternCard(e,status){
    const u=getUnit(e.unitId);
    const isSentence=e.mode==='sentence';
    const title=isSentence?u.es:u.term;
    const expected=isSentence?u.en:u.meaning;
    const due=isSentence||e.mode==='word'
      ? (u.dueSession!=null && (u.reviewMode||'word')===e.mode ? u.dueSession : null)
      : null;
    const improving=status!=='resolved' && (e.successesAfterFailure||0)>0;
    const badge=status==='resolved'
      ? '<span class="wrong-badge resolved">Resuelto</span>'
      : improving
        ? `<span class="wrong-badge improving">Mejorando · ${e.successesAfterFailure}/2</span>`
        : `<span class="wrong-badge recurrent">${e.failures} fallos</span>`;
    const last=e.lastAnswer
      ? `<div class="wrong-answer">Última respuesta: <b>${escapeHtml(e.lastAnswer)}</b></div>`
      : '<div class="wrong-answer">La última vez marcaste que no la sabías.</div>';
    const progress=status==='resolved'
      ? `Resuelto después de ${e.failures} fallo${e.failures===1?'':'s'}.`
      : `${e.successesAfterFailure||0}/2 aciertos desde el último fallo · ${whenText(due)}.`;
    return `<article class="wrong-card ${status==='resolved'?'resolved':'recurrent'}"><div class="wrong-top"><div><div class="wrong-title">${escapeHtml(title)}</div><div class="wrong-progress">${isSentence?'Sentence':'Word'} · ${progress}</div></div>${badge}</div>${last}<div class="wrong-answer">Respuesta esperada: <b>${escapeHtml(expected)}</b></div></article>`;
  }

  const recurrentHtml=recurrent.length
    ? recurrent.map(e=>patternCard(e,'recurrent')).join('')
    : '<div class="wrong-empty"><b>Ningún error recurrente.</b><br>Cuando un mismo error de Word o Sentence se repita, Noma lo destacará aquí.</div>';
  const resolvedHtml=resolved.length
    ? resolved.map(e=>patternCard(e,'resolved')).join('')
    : '<div class="wrong-empty">Todavía no hay errores recurrentes resueltos.</div>';

  return `${renderTop()}<h1 class="section-title">Forget Me</h1><p class="section-sub">Una sola vista para lo que Noma quiere recuperar y para los errores que se convierten en patrón.</p>
    <section class="wrong-section"><div class="wrong-section-head"><h2>Por repasar</h2><span>${pending.length}</span></div><div class="forget-section-note">Fallos o comprobaciones pendientes que volverán automáticamente cuando toque.</div><div class="forget-list" style="margin:6px 0 0">${pendingHtml}</div></section>
    <section class="wrong-section"><div class="wrong-section-head"><h2>Recurrentes</h2><span>${recurrent.length}</span></div><div class="forget-section-note">Errores de Word o Sentence que ya se han repetido. Dos aciertos posteriores los resuelven.</div>${recurrentHtml}</section>
    <section class="wrong-section"><div class="wrong-section-head"><h2>Resueltos</h2><span>${resolved.length}</span></div><div class="forget-section-note">Historial de errores que fueron recurrentes y ya han dejado de necesitar atención.</div>${resolvedHtml}</section>
    ${renderNav('forget')}`;
}

function readerText(id){ return READER_TEXTS.find(t=>t.id===id); }
function readerStatus(id){
  const p=state.readerProgress?.[id];
  if(!p?.attempts) return 'Sin leer';
  const errors=Math.max(0,6-(p.lastScore||0));
  if(errors>0) return `${errors} ${errors===1?'fallo':'fallos'} · ${p.lastScore}/6 última`;
  return `6/6 · ${p.attempts===1?'1 lectura':`${p.attempts} lecturas`}`;
}
function readerSortKey(t, index){
  const p=state.readerProgress?.[t.id];
  if(!p?.attempts) return {group:0, errors:0, date:0, index};
  const errors=Math.max(0,6-(p.lastScore||0));
  if(errors>0) return {group:1, errors, date:p.lastRead||0, index};
  return {group:2, errors:0, date:p.lastRead||0, index};
}
function readerLibrary(){
  const progress=state.readerProgress||{};
  const unread=READER_TEXTS.filter(t=>!(progress[t.id]?.attempts));
  const completed=READER_TEXTS.filter(t=>(progress[t.id]?.attempts||0)>0).sort((a,b)=>{
    const pa=progress[a.id], pb=progress[b.id];
    const ea=Math.max(0,6-(pa.lastScore||0)), eb=Math.max(0,6-(pb.lastScore||0));
    const aHas=ea>0, bHas=eb>0;
    if(aHas!==bHas) return aHas?-1:1;
    if(aHas && ea!==eb) return eb-ea;
    if(aHas && (pa.lastRead||0)!==(pb.lastRead||0)) return (pa.lastRead||0)-(pb.lastRead||0);
    if(!aHas && (pa.lastRead||0)!==(pb.lastRead||0)) return (pb.lastRead||0)-(pa.lastRead||0);
    return READER_TEXTS.indexOf(a)-READER_TEXTS.indexOf(b);
  });

  function card(t, isUnread){
    const p=progress[t.id];
    const errors=p?.attempts?Math.max(0,6-(p.lastScore||0)):0;
    const badge=isUnread
      ? '<span class="reader-status-badge pending">Pendiente</span>'
      : errors>0
        ? `<span class="reader-status-badge errors">${errors} ${errors===1?'fallo':'fallos'} · ${p.lastScore}/6</span>`
        : `<span class="reader-status-badge done">Completado · 6/6</span>`;
    return `<article class="reader-card"><div>${badge}<h2 style="margin-top:10px">${escapeHtml(t.title)}</h2><p>${escapeHtml(t.description)}</p></div><div class="reader-meta"><span>${t.words} palabras</span><span>~${t.minutes} min</span><span>6 preguntas</span>${!isUnread&&p?.attempts>1?`<span>${p.attempts} lecturas</span>`:''}</div><button class="secondary" onclick="startReader('${t.id}')">${isUnread?'Leer':'Releer'}</button></article>`;
  }

  const pendingHtml=unread.length
    ? unread.map(t=>card(t,true)).join('')
    : '<div class="reader-group-empty">No tienes textos pendientes de primera lectura.</div>';
  const completedHtml=completed.length
    ? completed.map(t=>card(t,false)).join('')
    : '<div class="reader-group-empty">Aún no has completado ningún texto.</div>';

  return `${renderTop()}<h1 class="section-title">Tiny Reader</h1><p class="section-sub">Lecturas del pack Everyday English con seis preguntas de comprensión.</p><div class="reader-library"><section class="reader-group pending"><div class="reader-group-head"><h2>Pendientes de leer</h2><span>${unread.length}</span></div>${pendingHtml}</section><section class="reader-group completed"><div class="reader-group-head"><h2>Completados</h2><span>${completed.length}</span></div>${completedHtml}</section></div>${renderNav('home')}`;
}
function startReader(id){
  const t=readerText(id); if(!t) return;
  state.readerSession={textId:id,phase:'reading',questionIndex:0,score:0,answers:[],selected:null,answered:false,finished:false,startedAt:Date.now()};
  state.screen='reader'; save(); render(); requestAnimationFrame(()=>window.scrollTo(0,0));
}
function exitReader(){ state.readerSession=null; state.screen='readerLibrary'; save(); render(); requestAnimationFrame(()=>window.scrollTo(0,0)); }
function beginReaderQuestions(){
  if(!state.readerSession) return;
  state.readerSession.phase='quiz'; state.readerSession.questionIndex=0; state.readerSession.selected=null; state.readerSession.answered=false;
  save(); render(); requestAnimationFrame(()=>window.scrollTo(0,0));
}
function answerReaderOption(index){
  const s=state.readerSession, t=s&&readerText(s.textId); if(!s||!t||s.phase!=='quiz'||s.answered) return;
  const q=t.questions[s.questionIndex]; if(!q || index<0 || index>=q.options.length) return;
  const ok=index===q.correct;
  s.selected=index; s.answered=true; if(ok) s.score++;
  s.answers.push({questionIndex:s.questionIndex,selected:index,correct:ok});
  save(); render();
}
function nextReaderQuestion(){
  const s=state.readerSession, t=s&&readerText(s.textId); if(!s||!t||!s.answered) return;
  if(s.questionIndex>=t.questions.length-1){ finishReader(); return; }
  s.questionIndex++; s.selected=null; s.answered=false; save(); render(); requestAnimationFrame(()=>window.scrollTo(0,0));
}
function finishReader(){
  const s=state.readerSession, t=s&&readerText(s.textId); if(!s||!t) return;
  const prev=state.readerProgress[t.id]||{attempts:0,bestScore:0,lastScore:0,lastRead:null};
  state.readerProgress[t.id]={attempts:(prev.attempts||0)+1,bestScore:Math.max(prev.bestScore||0,s.score),lastScore:s.score,lastRead:Date.now()};
  s.phase='result'; s.finished=true; save(); render(); requestAnimationFrame(()=>window.scrollTo(0,0));
}
function readerScreen(){
  const s=state.readerSession, t=s&&readerText(s.textId); if(!s||!t){state.screen='readerLibrary';save();return readerLibrary();}
  if(s.phase==='reading'){
    const paragraphs=t.paragraphs.map(p=>`<p>${escapeHtml(p)}</p>`).join('');
    return `<div class="reader-head"><button class="reader-back" onclick="exitReader()">←</button><div class="reader-head-copy"><b>Tiny Reader</b><span>${t.words} palabras · ~${t.minutes} min</span></div></div><article class="reader-article"><h1>${escapeHtml(t.title)}</h1><p class="reader-lede">Lee a tu ritmo. Las preguntas aparecen solo cuando termines el texto.</p><div class="reader-body">${paragraphs}</div><button class="primary reader-start-quiz" onclick="beginReaderQuestions()">Responder 6 preguntas</button></article>`;
  }
  if(s.phase==='quiz'){
    const q=t.questions[s.questionIndex], total=t.questions.length, current=s.questionIndex+1, progress=Math.round((s.questionIndex/total)*100);
    const options=q.options.map((opt,i)=>{
      let cls='reader-option';
      if(s.answered){
        if(i===q.correct) cls+=' correct';
        else if(i===s.selected) cls+=' wrong';
        else cls+=' dim';
      }
      return `<button class="${cls}" onclick="answerReaderOption(${i})" ${s.answered?'disabled':''}>${escapeHtml(opt)}</button>`;
    }).join('');
    const feedback=s.answered?`<div class="reader-feedback ${s.selected===q.correct?'ok':'bad'}"><b>${s.selected===q.correct?'Correcto.':'No exactamente.'}</b>${s.selected===q.correct?'Has entendido este punto del texto.':`La respuesta es: ${escapeHtml(q.options[q.correct])}`}</div><button class="primary reader-next" onclick="nextReaderQuestion()">${current===total?'Ver resultado':'Siguiente'}</button>`:'';
    return `<div class="exercise-head"><button class="back" onclick="exitReader()">←</button><div class="step-track"><div style="width:${progress}%"></div></div><div class="step-count">${current}/${total}</div></div><div class="reader-question-wrap"><div class="exercise-type">${escapeHtml(t.title)}</div><div class="reader-question">${escapeHtml(q.q)}</div><div class="reader-options">${options}</div>${feedback}</div>`;
  }
  const progress=state.readerProgress[t.id]||{lastScore:s.score,bestScore:s.score};
  return `<div class="reader-head"><button class="reader-back" onclick="exitReader()">←</button><div class="reader-head-copy"><b>Tiny Reader</b><span>${escapeHtml(t.title)}</span></div></div><section class="reader-result"><div class="eyebrow">Comprensión</div><div class="reader-score">${s.score}<span>/ 6</span></div><p>${s.score===6?'Has respondido correctamente las seis preguntas.':`Has acertado ${s.score} de 6. Puedes releer el texto cuando quieras; no afecta al contador de palabras.`}</p><div class="reader-result-actions"><button class="primary" onclick="exitReader()">Volver a lecturas</button><button class="secondary" onclick="startReader('${t.id}')">Releer texto</button></div></section>`;
}

function backupPayload(){
  const snapshot=JSON.parse(JSON.stringify(state));
  snapshot.session=null;
  if(snapshot.screen==='exercise'||snapshot.screen==='done') snapshot.screen='home';
  snapshot.schemaVersion=STATE_SCHEMA_VERSION;
  return {
    format:BACKUP_FORMAT,
    backupVersion:BACKUP_VERSION,
    appVersion:APP_VERSION,
    createdAt:new Date().toISOString(),
    packSize:PACK_SIZE,
    state:snapshot
  };
}
function setDataStatus(message){
  const el=document.getElementById('dataStatus');
  if(el) el.textContent=message;
}
function exportBackup(){
  try{
    state.lastBackupAt=Date.now();
    save();
    const payload=backupPayload();
    const json=JSON.stringify(payload,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const stamp=new Date().toISOString().slice(0,10);
    const a=document.createElement('a');
    a.href=url; a.download=`noma-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    setDataStatus('Copia exportada · guárdala en un lugar seguro');
  }catch(e){
    setDataStatus('No se pudo exportar la copia en este navegador');
  }
}
function validateBackup(payload){
  if(!payload || payload.format!==BACKUP_FORMAT || payload.backupVersion!==BACKUP_VERSION) throw new Error('Formato de copia no reconocido');
  if(!payload.state || !Array.isArray(payload.state.units) || payload.state.units.length!==PACK_SIZE) throw new Error('La copia no corresponde al pack actual');
  const ids=payload.state.units.map(u=>u.id);
  if(new Set(ids).size!==PACK_SIZE || !baseUnits.every(u=>ids.includes(u.id))) throw new Error('Las unidades de la copia no son válidas');
  return migrateState(payload.state);
}
async function importBackup(event){
  const input=event?.target;
  const file=input?.files?.[0];
  if(!file) return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    const restored=validateBackup(payload);
    if(!confirm('Importar esta copia sustituirá el progreso actual de Noma en este dispositivo. ¿Continuar?')){ input.value=''; return; }
    state=restored;
    state.screen='progress'; state.session=null;
    save(); render();
    setDataStatus(`Copia restaurada · ${payload.createdAt?new Date(payload.createdAt).toLocaleDateString():'fecha desconocida'}`);
  }catch(e){
    alert(`No se pudo importar la copia. ${e?.message||''}`.trim());
  }finally{ if(input) input.value=''; }
}

function seedForgetMe(){
  state.units.slice(0,3).forEach((u,i)=>{u.status='unstable';u.due=true;u.dueSession=(state.sessionNumber||0)+1+i;u.reviewKind='forget';u.reviewMode=i%2?'sentence':'word';u.mistakes=Math.max(1,u.mistakes);u.recognition=Math.max(1,u.recognition);}); save(); render();
}

  if(state.screen!=='exercise') window.scrollTo(0,0);

  app.innerHTML=`<div class="topbar"><div class="brand">Noma</div><div class="lang">Beta 1</div></div>
    <section class="card">
      <div class="eyebrow">Protección de datos</div>
      <h1 class="section-title" style="font-size:30px">No voy a iniciar un progreso vacío.</h1>
      <p class="note">No se ha podido abrir SQLite y tampoco encuentro una copia local de recuperación. Tus datos existentes no se han sobrescrito.</p>
      <p class="note">${escapeHtml(error?.message||'Error de almacenamiento')}</p>
      <div class="demo-actions">
        <button class="primary" onclick="location.reload()">Reintentar</button>
        <button class="ghost" onclick="document.getElementById('recoveryImport').click()">Restaurar copia JSON</button>
      </div>
      <input id="recoveryImport" type="file" accept="application/json,.json" style="display:none" onchange="recoverStorageFromBackup(event)">
    </section>`;
}
async function recoverStorageFromBackup(event){
  const input=event?.target;
  const file=input?.files?.[0];
  if(!file) return;
  try{
    const payload=JSON.parse(await file.text());
    state=validateBackup(payload);
    state.screen='home'; state.session=null; state.readerSession=null;
    Storage.save(state);
    render();
  }catch(error){
    alert('No se pudo restaurar la copia. '+(error?.message||''));
  }finally{ if(input) input.value=''; }
}
async function bootstrap(){
  try{
    state=await load();
  }catch(error){
    console.error(error);
    renderStorageFailure(error);
    return;
  }
  // A fresh launch always opens on Hoy. Learning history remains untouched.
  state.screen='home'; state.session=null; state.readerSession=null; save();
  render();
}
window.recoverStorageFromBackup=recoverStorageFromBackup;
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'})
      .then(async reg=>{
        const active=await navigator.serviceWorker.ready;
        active.active?.postMessage({type:'NOMA_CACHE_AUDIO'});
      })
      .catch(error=>console.warn('Noma offline no disponible',error));
  });
}
bootstrap();

</script>
