name: Session-planning regression tests

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/session-planning.test.cjs
      - tests/progress-isolation.test.cjs
      - tests/backup-export.test.cjs
      - tests/multipack.test.cjs
      - 'packs/**'
      - 'readers/**'
      - tests/content-expansion.test.cjs
      - .github/workflows/session-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-session-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate JavaScript and session selection
        run: node --test tests/*.test.cjs
