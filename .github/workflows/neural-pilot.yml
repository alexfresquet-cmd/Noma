name: Build natural Noma voice pilot
on:
  push:
    branches: [main]
    paths:
      - audio/neural_pilot.py
      - .github/workflows/neural-pilot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    if: github.repository == 'alexfresquet-cmd/Noma'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Install CPU PyTorch and natural speech pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro==0.9.4" "soundfile>=0.12,<1"
      - name: Generate six test clips
        run: python audio/neural_pilot.py
      - name: Commit samples to Noma
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/neural-preview
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Add Kokoro natural speech pilot clips for Noma"
            git push origin HEAD:main
          fi
