name: Build Noma offline pronunciation pack
on:
  push:
    branches: [main]
    paths:
      - audio/catalog.json
      - audio/build_audio.py
      - .github/workflows/audio-pack.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-audio:
    if: github.repository == 'alexfresquet-cmd/Noma'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install local open-source speech synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Render local beta audio clips
        run: python3 audio/build_audio.py
      - name: Commit generated MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/listen audio/pronounce
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Generate Noma offline audio clips for Beta 1"
            git push origin HEAD:main
          fi
